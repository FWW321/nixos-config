# 每次 push/PR:nix-installer 装最新 Nix → flake check(全 outputs 求值,含
# nixosConfigurations 与 providers-schema checks)→ 格式检查(未格式化即红)。
# 本地 --no-build 查不了的 build 型漂移,这里会现形;完整系统构建不在 CI 范围
# (cachyos 内核闭包大,推 cache 另议)。
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      # 公开仓库免费;加速 inputs/checks 拉取
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Flake check (all outputs)
        run: nix flake check

      - name: Format + lint check (RFC 166 / deadnix / statix)
        run: |
          nix fmt
          git diff --exit-code

      # facter.json 序列号脱敏校验(公开仓库;脚本见 hosts/FWW-Desktop/redact.sh)
      - name: Facter privacy check
        run: hosts/FWW-Desktop/redact.sh --check

      # install.sh 向导物化回归:3 组夹具(单盘Turing/三盘legacy/无独显AMD)
      # 走同一 materialize_host 真源 → 完整求值。模板 token 或 sed 改动
      # 破坏物化,在这里红;不用装机介质也能持续验证向导输出正确性
      - name: install.sh materialization selftest
        run: ./install.sh --selftest
